<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Instalada en la pantalla de inicio, la app corre a pantalla completa.
         El manifiesto es quien declara el scope, y el scope es lo que mantiene
         dentro de la app la navegación entre el panel, refacciones y el mapa:
         sin él, iOS decide documento por documento y acaba saliéndose a Safari.
         Va enlazado en TODAS las páginas, porque cualquiera de ellas puede ser
         la que se añada a la pantalla de inicio. Las metas se quedan para las
         instalaciones viejas, hechas antes de que existiera el manifiesto.
         status-bar-style "default" mantiene la franja de la barra de estado
         fuera del viewport, que es lo que suponen los estilos. -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mapa de Activos</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        html, body {
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100%;
            overflow: hidden;
            overscroll-behavior-y: none;
        }

        /* La franja de la barra de estado sigue el fondo de esta pantalla y
           no el de estilos.css, que es el del panel principal. */
        html.modal-abierto {
            background-color: #f8fafc;
        }

        #panel-independiente-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            background: #f8fafc;
            overflow: hidden;

            /* Con viewport-fit=cover la página llega hasta el borde físico:
               el padding superior aparta el encabezado de la barra de estado
               y el inferior, el lienzo del indicador de inicio. Mismo criterio
               que 10-refacciones.html. En pantallas sin notch env() vale 0. */
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #encabezado {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: white;
            flex-shrink: 0;
        }

        /* El resumen hace también de leyenda: los puntos de color son los
           mismos con los que se pintan las bandas de los cuadros. */
        #resumen-global {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 2px;
        }

        #barra-ruta {
            padding: 6px 10px 6px 16px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.84rem;
        }

        #ruta {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 2px;
            min-width: 0;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #ruta::-webkit-scrollbar { display: none; }

        .ruta-paso {
            border: none;
            background: transparent;
            padding: 4px 5px;
            border-radius: 7px;
            font: inherit;
            color: #0284c7;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .ruta-paso:active { background: #e0f2fe; }

        .ruta-paso[disabled] {
            color: #0f172a;
            cursor: default;
        }

        .ruta-flecha {
            color: #cbd5e1;
            flex-shrink: 0;
        }

        /* Lienzo del treemap. Los cuadros se colocan en absoluto sobre él, con
           las coordenadas que calcula d3.treemap. */
        /* El fondo del lienzo es lo que se ve entre cuadro y cuadro: la
           rejilla de 1px que deja el treemap es toda la separación que hay. */
        #lienzo {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0f172a;
        }

        /* Los cuadros se pegan unos a otros: no llevan borde propio ni
           esquinas redondeadas, porque la línea negra que los separa es el
           fondo del lienzo asomando por la rejilla. Un borde encima daría
           dos píxeles entre vecinos y uno solo contra el marco. */
        .cuadro {
            position: absolute;
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
            touch-action: manipulation;
        }

        .cuadro:active { filter: brightness(0.93); }

        /* El cuadro es la pila de solicitudes del activo: su tamaño las
           cuenta todas y el relleno sube desde abajo conforme se entregan,
           así que lo que queda sin llenar es justo lo que sigue pendiente. */
        .cuadro-relleno {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .cuadro-cuerpo {
            position: relative;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3px 4px;
            overflow: hidden;
        }

        .cuadro-cuerpo > div {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cuadro-titulo {
            font-weight: 800;
            color: #0f172a;
            line-height: 1.1;
        }

        /* El segundo renglón del título, cuando el ID se parte para caber. */
        .cuadro-titulo--seguido {
            margin-top: -0.06em;
        }

        .cuadro-dato { font-weight: 700; line-height: 1.25; }
        .cuadro-sub { color: #475569; line-height: 1.25; }
        .cuadro-extra { color: #7f1d1d; font-weight: 700; line-height: 1.25; }

        #aviso-lienzo {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            background: #f8fafc;
            color: #64748b;
            font-size: 0.95rem;
        }

        /* Fichas del desglose dentro de la hoja de detalle. */
        .ficha-metrica {
            flex: 1;
            min-width: 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
        }

        .ficha-metrica .cifra {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .ficha-metrica .rotulo {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .renglon-solicitud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
        }

        .renglon-solicitud:last-child { border-bottom: none; }

        .etiqueta-estado {
            flex-shrink: 0;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
        }

        /* Lista del nivel: la forma de llegar a un cuadro demasiado pequeño
           para tocarlo, que es lo que le pasa a un equipo sin solicitudes. */
        #lista-nivel {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 calc(12px + env(safe-area-inset-bottom));
        }

        .renglon-nivel {
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 25px;
            border: none;
            border-bottom: 1px solid #f1f5f9;
            background: white;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .renglon-nivel:active { background: #f1f5f9; }

        /* La marca de la lista es el mismo cuadro en pequeño: se llena por
           abajo en la misma proporción. */
        .renglon-nivel .marca {
            position: relative;
            width: 10px;
            height: 34px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .renglon-nivel .marca > div {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }
    </style>
</head>
<body>

    <div id="panel-independiente-container">
        <div id="encabezado">
            <div style="min-width:0;">
                <h2 style="margin:0; color:#0f172a; font-size:1.25rem; display:flex; align-items:center; gap:8px;">🗺️ Mapa de Activos</h2>
                <div id="resumen-global">Cargando…</div>
            </div>
            <button onclick="window.location.href='10-refacciones.html'" class="ios-boton-icono ios-boton-icono--destructivo" title="Volver a Refacciones" aria-label="Volver a Refacciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></svg></button>
        </div>

        <div id="barra-ruta">
            <div id="ruta"></div>
            <button id="btn-lista-nivel" class="ios-boton-icono" title="Ver en lista" aria-label="Ver en lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg></button>
        </div>

        <div id="lienzo">
            <div id="aviso-lienzo">Cargando el mapa…</div>
        </div>
    </div>

    <div id="modal-detalle-activo" class="hoja-overlay" style="z-index:2000;">
        <div class="form-content hoja-contenido" style="max-width:520px; overflow-y:auto;">
            <div class="hoja-encabezado">
                <div style="min-width:0;">
                    <h3 class="hoja-titulo" id="detalle-titulo">Detalle</h3>
                    <div class="hoja-subtitulo" id="detalle-subtitulo"></div>
                </div>
                <button onclick="window.cerrarDetalleActivo()" class="ios-boton-cerrar ios-boton-icono"
                        title="Cerrar" aria-label="Cerrar"></button>
            </div>
            <div id="detalle-cuerpo"></div>
        </div>
    </div>

    <div id="modal-lista-nivel" class="hoja-overlay" style="z-index:2100;">
        <div class="hoja-contenido" style="max-width:520px; overflow:hidden; padding:12px 0 0;">
            <div class="hoja-encabezado-lista">
                <div style="min-width:0;">
                    <h3 class="hoja-titulo" id="lista-titulo">Lista</h3>
                    <div class="hoja-subtitulo" id="lista-subtitulo"></div>
                </div>
                <button onclick="window.cerrarListaNivel()" class="ios-boton-cerrar ios-boton-icono"
                        title="Cerrar" aria-label="Cerrar"></button>
            </div>
            <div id="lista-nivel"></div>
        </div>
    </div>

    <script src="1-config.js"></script>

    <script>
        window.addEventListener('load', async () => {
            const lienzo = document.getElementById('lienzo');
            const aviso = document.getElementById('aviso-lienzo');

            // Catálogos y solicitudes en crudo, tal como llegan de la base.
            let plantas = [];
            let lineas = [];
            let equipos = [];
            let refacciones = [];

            // Métricas ya agregadas por nivel. Se recalculan sólo al cargar o
            // al guardar un cambio, no en cada repintado.
            let metricasPorEquipo = new Map();
            let metricasPorLinea = new Map();
            let metricasPorPlanta = new Map();
            let solicitudesPorEquipo = new Map();

            // Nivel que se está viendo: [] = plantas, [planta] = sus líneas,
            // [planta, linea] = sus equipos.
            let ruta = [];

            const CERRADOS = ['Entregada', 'Recibida'];
            const SIN_PLANTA = 'sin-planta';
            const SIN_LINEA = 'sin-linea';

            // Canvas suelto con el que se mide el texto de los cuadros. Se
            // declara aquí arriba porque el primer dibujo ocurre en cuanto
            // responde la base, antes de llegar al resto del archivo.
            const MEDIDOR = document.createElement('canvas').getContext('2d');
            const FUENTE = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

            // ==========================================
            // Carga
            // ==========================================
            try {
                const [resPlantas, resLineas, resEquipos, resRefacciones] = await Promise.all([
                    sb.from('plantas').select('id, nombre').order('nombre'),
                    sb.from('lineas').select('id, nombre, planta_id').order('nombre'),
                    sb.from('equipos').select('id, nombre, id_interno, planta_id, linea_id, activo').order('nombre'),
                    sb.from('refacciones').select('id, nombre_refaccion, estado, prioridad, cantidad, unidad, equipo_id, created_at').order('created_at', { ascending: false })
                ]);

                for (const res of [resPlantas, resLineas, resEquipos, resRefacciones]) {
                    if (res.error) throw res.error;
                }

                plantas = resPlantas.data || [];
                lineas = resLineas.data || [];
                equipos = resEquipos.data || [];
                refacciones = resRefacciones.data || [];

                agregarMetricas();
                aplicarRuta([], false);
            } catch (error) {
                console.error("Error cargando el mapa de activos:", error);
                aviso.style.display = 'flex';
                aviso.style.color = '#ef4444';
                aviso.innerText = "Ocurrió un error al cargar la base de datos.";
                document.getElementById('resumen-global').innerText = "Sin datos";
                return;
            }

            // ==========================================
            // Agregación
            // ==========================================

            // Cada solicitud cuelga de un equipo, y el equipo de una línea y
            // una planta. La planta se toma primero del propio equipo y, si le
            // falta, se deduce de su línea: así un equipo al que sólo se le
            // puso la línea sigue apareciendo bajo la planta correcta.
            function plantaDeEquipo(equipo) {
                if (equipo.planta_id !== null && equipo.planta_id !== undefined) return String(equipo.planta_id);
                const linea = lineas.find(l => String(l.id) === String(equipo.linea_id));
                if (linea && linea.planta_id !== null && linea.planta_id !== undefined) return String(linea.planta_id);
                return SIN_PLANTA;
            }

            function lineaDeEquipo(equipo) {
                return (equipo.linea_id === null || equipo.linea_id === undefined) ? SIN_LINEA : String(equipo.linea_id);
            }

            function metricaVacia() {
                return { total: 0, pendientes: 0, cerradas: 0, canceladas: 0, urgentes: 0 };
            }

            // Las canceladas no cuentan ni para el tamaño ni para el color: no
            // son carga pendiente ni trabajo resuelto. Se guardan aparte para
            // poder mencionarlas en el detalle.
            function sumarSolicitud(m, req) {
                if (req.estado === 'Cancelada') {
                    m.canceladas++;
                    return;
                }
                m.total++;
                if (CERRADOS.includes(req.estado)) {
                    m.cerradas++;
                } else {
                    m.pendientes++;
                    if (req.prioridad === 'Urgente') m.urgentes++;
                }
            }

            function acumular(mapa, clave, req) {
                if (!mapa.has(clave)) mapa.set(clave, metricaVacia());
                sumarSolicitud(mapa.get(clave), req);
            }

            function agregarMetricas() {
                metricasPorEquipo = new Map();
                metricasPorLinea = new Map();
                metricasPorPlanta = new Map();
                solicitudesPorEquipo = new Map();

                const indiceEquipos = new Map(equipos.map(e => [String(e.id), e]));
                const global = metricaVacia();

                refacciones.forEach(req => {
                    const equipo = indiceEquipos.get(String(req.equipo_id));

                    // Una solicitud sin equipo vivo (borrado, o nunca asignado)
                    // no se pierde: cae en los cajones "sin planta / sin línea",
                    // que sí se dibujan.
                    const clavePlanta = equipo ? plantaDeEquipo(equipo) : SIN_PLANTA;
                    const claveLinea = equipo ? lineaDeEquipo(equipo) : SIN_LINEA;

                    acumular(metricasPorPlanta, clavePlanta, req);
                    acumular(metricasPorLinea, clavePlanta + '|' + claveLinea, req);
                    sumarSolicitud(global, req);

                    if (equipo) {
                        const claveEquipo = String(equipo.id);
                        acumular(metricasPorEquipo, claveEquipo, req);
                        if (!solicitudesPorEquipo.has(claveEquipo)) solicitudesPorEquipo.set(claveEquipo, []);
                        solicitudesPorEquipo.get(claveEquipo).push(req);
                    }
                });

                const pct = global.total ? Math.round((global.cerradas / global.total) * 100) : 0;
                document.getElementById('resumen-global').innerHTML =
                    `<span style="color:#dc2626;">●</span> ${global.pendientes} pendientes · ` +
                    `<span style="color:#16a34a;">●</span> ${global.cerradas} entregadas · ${pct}% de ${global.total}`;
            }

            function metricaDe(mapa, clave) {
                return mapa.get(clave) || metricaVacia();
            }

            // ==========================================
            // Nodos del nivel visible
            // ==========================================
            function nodosDelNivel() {
                if (ruta.length === 0) return nodosPlantas();
                if (ruta.length === 1) return nodosLineas(ruta[0].id);
                return nodosEquipos(ruta[0].id, ruta[1].id);
            }

            function nodosPlantas() {
                const nodos = plantas.map(p => ({
                    tipo: 'planta',
                    id: String(p.id),
                    titulo: p.nombre,
                    metrica: metricaDe(metricasPorPlanta, String(p.id))
                }));

                if (metricasPorPlanta.has(SIN_PLANTA) || equipos.some(e => plantaDeEquipo(e) === SIN_PLANTA)) {
                    nodos.push({
                        tipo: 'planta',
                        id: SIN_PLANTA,
                        titulo: 'Sin planta',
                        metrica: metricaDe(metricasPorPlanta, SIN_PLANTA)
                    });
                }
                return nodos;
            }

            function nodosLineas(clavePlanta) {
                const propias = lineas.filter(l => {
                    if (clavePlanta === SIN_PLANTA) return l.planta_id === null || l.planta_id === undefined;
                    return String(l.planta_id) === clavePlanta;
                });

                const nodos = propias.map(l => ({
                    tipo: 'linea',
                    id: String(l.id),
                    titulo: l.nombre,
                    metrica: metricaDe(metricasPorLinea, clavePlanta + '|' + String(l.id))
                }));

                // Equipos de esta planta a los que no se les puso línea.
                const hayHuerfanos = metricasPorLinea.has(clavePlanta + '|' + SIN_LINEA) ||
                    equipos.some(e => plantaDeEquipo(e) === clavePlanta && lineaDeEquipo(e) === SIN_LINEA);

                if (hayHuerfanos) {
                    nodos.push({
                        tipo: 'linea',
                        id: SIN_LINEA,
                        titulo: 'Sin línea',
                        metrica: metricaDe(metricasPorLinea, clavePlanta + '|' + SIN_LINEA)
                    });
                }
                return nodos;
            }

            function nodosEquipos(clavePlanta, claveLinea) {
                return equipos
                    .filter(e => plantaDeEquipo(e) === clavePlanta && lineaDeEquipo(e) === claveLinea)
                    .map(e => ({
                        tipo: 'equipo',
                        id: String(e.id),
                        // El ID interno hace de matrícula: es corto y cabe en el
                        // cuadro. El nombre completo baja al subtítulo.
                        titulo: e.id_interno || e.nombre,
                        subtitulo: e.id_interno ? e.nombre : '',
                        inactivo: e.activo === false,
                        metrica: metricaDe(metricasPorEquipo, String(e.id))
                    }))
                    // Un equipo dado de baja sólo estorba si además no dejó
                    // historial; con solicitudes encima se queda a la vista.
                    .filter(n => !n.inactivo || n.metrica.total > 0 || n.metrica.canceladas > 0);
            }

            // ==========================================
            // Color
            // ==========================================
            // Ya no hace falta una escala de intensidad: el reparto entre
            // verde y rojo lo dice el propio relleno. Quedan dos colores, el
            // de lo entregado y el de lo pendiente, más un gris para el activo
            // que nunca ha pedido nada. Los tonos son claros a propósito,
            // porque los números van escritos encima.
            function colorDe(metrica) {
                if (metrica.total === 0) return { fondo: '#e2e8f0', relleno: '#e2e8f0', texto: '#64748b' };
                const p = metrica.cerradas / metrica.total;
                return {
                    fondo: '#fecaca',
                    relleno: '#86efac',
                    // Tonos oscuros: tienen que leerse tanto sobre el verde
                    // como sobre el rojo, porque el texto cae donde caiga.
                    texto: p >= 0.60 ? '#14532d' : (p >= 0.45 ? '#92400e' : '#7f1d1d')
                };
            }

            // ==========================================
            // Ajuste del título
            // ==========================================
            // El ID del equipo es lo que identifica al cuadro, así que se
            // muestra entero aunque el cuadro sea diminuto: en vez de
            // recortarlo, se busca el tamaño de letra al que cabe. Medir con
            // canvas da el ancho exacto de la fuente real sin escribir nada
            // en la página; devuelve el ancho por cada píxel de tamaño, que
            // es lo que hace falta para despejar el tamaño que cabe.
            function anchoPorPixel(texto) {
                MEDIDOR.font = '800 100px ' + FUENTE;
                return Math.max(MEDIDOR.measureText(texto).width / 100, 0.01);
            }

            // Corte en dos renglones por el guion o el espacio más cercano al
            // centro: "ATM-817" cabe al doble de tamaño partido en "ATM-" y
            // "817", que es la diferencia entre leerlo y no leerlo.
            function partirTitulo(texto) {
                const cortes = [];
                for (let i = 0; i < texto.length - 1; i++) {
                    if (texto[i] === '-' || texto[i] === ' ') cortes.push(i + 1);
                }
                if (cortes.length === 0) return null;

                const medio = texto.length / 2;
                const corte = cortes.reduce((a, b) => Math.abs(b - medio) < Math.abs(a - medio) ? b : a);
                const uno = texto.slice(0, corte).trim();
                const dos = texto.slice(corte).trim();
                return (uno && dos) ? [uno, dos] : null;
            }

            // ==========================================
            // Dibujo
            // ==========================================
            function dibujar() {
                const ancho = lienzo.clientWidth;
                const alto = lienzo.clientHeight;
                lienzo.querySelectorAll('.cuadro').forEach(el => el.remove());

                const nodos = nodosDelNivel();
                if (nodos.length === 0 || ancho <= 0 || alto <= 0) {
                    aviso.style.display = 'flex';
                    aviso.style.color = '#64748b';
                    aviso.innerText = ruta.length === 0
                        ? "No hay plantas registradas todavía."
                        : "Este nivel no tiene nada que mostrar.";
                    return;
                }
                aviso.style.display = 'none';

                // El tamaño es el número de solicitudes, pero un nodo en cero
                // no puede desaparecer del todo: sin un peso mínimo, un equipo
                // que nunca ha pedido nada no se podría ni abrir ni renombrar.
                // Aun así queda diminuto, y para eso está la lista del nivel.
                const raiz = d3.hierarchy({ hijos: nodos }, d => d.hijos)
                    .sum(d => (d.hijos ? 0 : Math.max(d.metrica.total, 0.35)))
                    .sort((a, b) => b.value - a.value);

                // 1px de separación, ni más: es el ancho de la línea negra.
                // paddingOuter cierra el marco contra el borde de la pantalla.
                d3.treemap()
                    .tile(d3.treemapSquarify)
                    .size([ancho, alto])
                    .paddingInner(1)
                    .paddingOuter(1)
                    .round(true)(raiz);

                raiz.leaves().forEach(hoja => {
                    lienzo.appendChild(construirCuadro(hoja));
                });
            }

            function construirCuadro(hoja) {
                const nodo = hoja.data;
                const m = nodo.metrica;
                const ancho = Math.max(hoja.x1 - hoja.x0, 0);
                const alto = Math.max(hoja.y1 - hoja.y0, 0);
                const area = ancho * alto;
                const color = colorDe(m);

                const proporcion = m.total ? m.cerradas / m.total : null;
                const pct = proporcion === null ? null : Math.round(proporcion * 100);

                const el = document.createElement('div');
                el.className = 'cuadro';
                el.style.left = hoja.x0 + 'px';
                el.style.top = hoja.y0 + 'px';
                el.style.width = ancho + 'px';
                el.style.height = alto + 'px';
                el.style.background = color.fondo;

                // El relleno lleva la proporción sin redondear: con el 99%
                // redondeado a 100 el cuadro se vería lleno sin estarlo.
                if (proporcion) {
                    const relleno = document.createElement('div');
                    relleno.className = 'cuadro-relleno';
                    relleno.style.background = color.relleno;
                    relleno.style.height = (proporcion * 100) + '%';
                    el.appendChild(relleno);
                }

                const cuerpo = document.createElement('div');
                cuerpo.className = 'cuadro-cuerpo';

                // El cuadro enseña tanto como quepa: primero el nombre, luego
                // el porcentaje, y sólo en los grandes el desglose completo.
                const tam = Math.max(9, Math.min(26, Math.sqrt(area) / 6.5));

                // Tamaño al que el título cabe entero, de una y de dos líneas.
                // El de dos sólo se usa si de verdad gana espacio; partir un
                // nombre que ya cabía sólo lo haría más difícil de leer.
                const anchoUtil = Math.max(ancho - 9, 4);
                const altoUtil = Math.max(alto - 6, 4);
                const partes = partirTitulo(nodo.titulo);
                const tamUnaLinea = anchoUtil / anchoPorPixel(nodo.titulo);
                const tamDosLineas = partes
                    ? Math.min(anchoUtil / Math.max(anchoPorPixel(partes[0]), anchoPorPixel(partes[1])),
                               altoUtil / 2.2)
                    : 0;
                const parte = tamUnaLinea < tam && tamDosLineas > tamUnaLinea * 1.15;
                const tamTitulo = Math.max(5, Math.min(tam, parte ? tamDosLineas : tamUnaLinea));

                (parte ? partes : [nodo.titulo]).forEach((texto, i) => {
                    const titulo = document.createElement('div');
                    titulo.className = 'cuadro-titulo' + (i > 0 ? ' cuadro-titulo--seguido' : '');
                    titulo.style.fontSize = tamTitulo + 'px';
                    titulo.innerText = texto;
                    cuerpo.appendChild(titulo);
                });

                // Los renglones de abajo no pasan del título: si el ID tuvo
                // que encogerse para caber, el resto se encoge con él.
                const tamDato = Math.min(tam * 0.62, tamTitulo * 0.9);
                const tamSub = Math.min(tam * 0.55, tamTitulo * 0.8);

                if (area >= 2600 && alto >= 44) {
                    const dato = document.createElement('div');
                    dato.className = 'cuadro-dato';
                    dato.style.fontSize = Math.max(8, tamDato) + 'px';
                    dato.style.color = color.texto;
                    dato.innerText = pct === null
                        ? 'Sin solicitudes'
                        : `${pct}% / ${m.pendientes} pend.`;
                    cuerpo.appendChild(dato);
                }

                if (area >= 7000 && alto >= 64 && pct !== null) {
                    const sub = document.createElement('div');
                    sub.className = 'cuadro-sub';
                    sub.style.fontSize = Math.max(8, tamSub) + 'px';
                    sub.innerText = `${m.cerradas}/${m.total} solicitudes`;
                    cuerpo.appendChild(sub);
                }

                if (area >= 13000 && alto >= 88) {
                    const extra = document.createElement('div');
                    if (m.urgentes > 0) {
                        extra.className = 'cuadro-extra';
                        extra.style.fontSize = Math.max(8, tamSub) + 'px';
                        extra.innerText = `🚨 ${m.urgentes} urgente${m.urgentes === 1 ? '' : 's'}`;
                        cuerpo.appendChild(extra);
                    } else if (nodo.subtitulo) {
                        extra.className = 'cuadro-sub';
                        extra.style.fontSize = Math.max(8, tamSub * 0.9) + 'px';
                        extra.innerText = nodo.subtitulo;
                        cuerpo.appendChild(extra);
                    }
                }

                el.appendChild(cuerpo);
                el.onclick = () => alTocarCuadro(nodo);
                return el;
            }

            // ==========================================
            // Navegación entre niveles
            // ==========================================
            function alTocarCuadro(nodo) {
                if (nodo.tipo === 'planta') {
                    aplicarRuta([{ tipo: 'planta', id: nodo.id, titulo: nodo.titulo }], true);
                } else if (nodo.tipo === 'linea') {
                    aplicarRuta([ruta[0], { tipo: 'linea', id: nodo.id, titulo: nodo.titulo }], true);
                } else {
                    abrirDetalleEquipo(nodo.id);
                }
            }

            // El gesto de volver de iOS sube un nivel en lugar de salirse de la
            // pantalla, que es lo que espera quien viene bajando por el mapa.
            function aplicarRuta(nuevaRuta, empujar) {
                ruta = nuevaRuta;
                if (empujar) {
                    history.pushState({ ruta: nuevaRuta }, '');
                } else {
                    history.replaceState({ ruta: nuevaRuta }, '');
                }
                pintarRuta();
                dibujar();
            }

            window.addEventListener('popstate', (evento) => {
                ruta = (evento.state && evento.state.ruta) ? evento.state.ruta : [];
                window.cerrarDetalleActivo();
                window.cerrarListaNivel();
                pintarRuta();
                dibujar();
            });

            function pintarRuta() {
                const contenedor = document.getElementById('ruta');
                contenedor.innerHTML = '';

                const pasos = [{ titulo: 'Plantas' }].concat(ruta);
                pasos.forEach((paso, i) => {
                    if (i > 0) {
                        const flecha = document.createElement('span');
                        flecha.className = 'ruta-flecha';
                        flecha.innerText = '›';
                        contenedor.appendChild(flecha);
                    }

                    const boton = document.createElement('button');
                    boton.className = 'ruta-paso';
                    boton.innerText = paso.titulo;
                    if (i === pasos.length - 1) {
                        boton.disabled = true;
                    } else {
                        boton.onclick = () => aplicarRuta(ruta.slice(0, i), true);
                    }
                    contenedor.appendChild(boton);
                });

                // En un teléfono la ruta completa no cabe; lo que importa ver
                // es el nivel actual, así que se desplaza hasta el final.
                contenedor.scrollLeft = contenedor.scrollWidth;
            }

            // ==========================================
            // Lista del nivel
            // ==========================================
            document.getElementById('btn-lista-nivel').onclick = () => {
                const nodos = nodosDelNivel().slice().sort((a, b) =>
                    (b.metrica.pendientes - a.metrica.pendientes) ||
                    (b.metrica.total - a.metrica.total) ||
                    a.titulo.localeCompare(b.titulo));

                const titulos = ['Plantas', 'Líneas', 'Equipos'];
                document.getElementById('lista-titulo').innerText = titulos[ruta.length];
                document.getElementById('lista-subtitulo').innerText =
                    ruta.length === 0 ? 'Toda la empresa' : ruta.map(p => p.titulo).join(' › ');

                const contenedor = document.getElementById('lista-nivel');
                contenedor.innerHTML = '';

                if (nodos.length === 0) {
                    const vacio = document.createElement('div');
                    vacio.style.cssText = 'padding:20px 25px; color:#94a3b8; font-style:italic;';
                    vacio.innerText = 'Este nivel no tiene nada que mostrar.';
                    contenedor.appendChild(vacio);
                }

                nodos.forEach(nodo => {
                    const m = nodo.metrica;
                    const color = colorDe(m);
                    const pct = m.total ? Math.round((m.cerradas / m.total) * 100) : null;

                    const fila = document.createElement('button');
                    fila.className = 'renglon-nivel';

                    const marca = document.createElement('div');
                    marca.className = 'marca';
                    marca.style.background = color.fondo;
                    if (pct !== null && m.cerradas > 0) {
                        const relleno = document.createElement('div');
                        relleno.style.background = color.relleno;
                        relleno.style.height = ((m.cerradas / m.total) * 100) + '%';
                        marca.appendChild(relleno);
                    }

                    const textos = document.createElement('div');
                    textos.style.cssText = 'flex:1; min-width:0;';
                    const nombre = document.createElement('div');
                    nombre.style.cssText = 'font-weight:700; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                    nombre.innerText = nodo.subtitulo ? `${nodo.titulo} · ${nodo.subtitulo}` : nodo.titulo;
                    const detalle = document.createElement('div');
                    detalle.style.cssText = 'font-size:0.78rem; color:#64748b;';
                    detalle.innerText = pct === null
                        ? 'Sin solicitudes'
                        : `${m.pendientes} pendientes de ${m.total}${m.urgentes ? ` · ${m.urgentes} urgentes` : ''}`;
                    textos.appendChild(nombre);
                    textos.appendChild(detalle);

                    const cifra = document.createElement('div');
                    cifra.style.cssText = `flex-shrink:0; font-weight:800; color:${color.texto};`;
                    cifra.innerText = pct === null ? '—' : pct + '%';

                    fila.appendChild(marca);
                    fila.appendChild(textos);
                    fila.appendChild(cifra);
                    fila.onclick = () => {
                        window.cerrarListaNivel();
                        alTocarCuadro(nodo);
                    };
                    contenedor.appendChild(fila);
                });

                document.getElementById('modal-lista-nivel').style.display = 'flex';
            };

            window.cerrarListaNivel = () => {
                document.getElementById('modal-lista-nivel').style.display = 'none';
            };

            // ==========================================
            // Hoja de detalle del equipo
            // ==========================================
            function abrirDetalleEquipo(idEquipo) {
                const equipo = equipos.find(e => String(e.id) === String(idEquipo));
                if (!equipo) return;

                const m = metricaDe(metricasPorEquipo, String(equipo.id));
                const pct = m.total ? Math.round((m.cerradas / m.total) * 100) : null;
                const color = colorDe(m);

                // Lo que sigue abierto va primero, y dentro de eso lo urgente:
                // una lista encabezada por diez entregadas no dice nada.
                const orden = (req) => {
                    if (req.estado === 'Cancelada') return 3;
                    if (CERRADOS.includes(req.estado)) return 2;
                    return req.prioridad === 'Urgente' ? 0 : 1;
                };
                const solicitudes = (solicitudesPorEquipo.get(String(equipo.id)) || [])
                    .slice().sort((a, b) => orden(a) - orden(b));

                document.getElementById('detalle-titulo').innerText = equipo.nombre;
                document.getElementById('detalle-subtitulo').innerText =
                    ruta.map(p => p.titulo).join(' › ') + (equipo.activo === false ? ' · Dado de baja' : '');

                const visibles = solicitudes.slice(0, 8);
                const restantes = solicitudes.length - visibles.length;

                const listaHtml = visibles.length === 0
                    ? '<div style="color:#94a3b8; font-style:italic; font-size:0.85rem; padding:8px 0;">Este equipo todavía no tiene solicitudes.</div>'
                    : visibles.map(req => {
                        const colores = colorEstado(req.estado);
                        const fecha = req.created_at
                            ? new Date(req.created_at).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' })
                            : '';
                        const urgente = req.prioridad === 'Urgente' && !CERRADOS.includes(req.estado) && req.estado !== 'Cancelada';
                        return `
                            <div class="renglon-solicitud">
                                <div style="min-width:0;">
                                    <div style="font-weight:600; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${urgente ? '🚨 ' : ''}${escapar(req.nombre_refaccion || 'Sin nombre')}</div>
                                    <div style="font-size:0.75rem; color:#94a3b8;">${escapar(String(req.cantidad || ''))} ${escapar(req.unidad || '')} · ${fecha}</div>
                                </div>
                                <span class="etiqueta-estado" style="background:${colores.fondo}; color:${colores.texto};">${escapar(req.estado || 'Pendiente')}</span>
                            </div>`;
                    }).join('');

                document.getElementById('detalle-cuerpo').innerHTML = `
                    <div style="display:flex; gap:8px; margin-bottom:14px;">
                        <div class="ficha-metrica">
                            <div class="cifra" style="color:${color.texto};">${pct === null ? '—' : pct + '%'}</div>
                            <div class="rotulo">Entregadas</div>
                        </div>
                        <div class="ficha-metrica">
                            <div class="cifra" style="color:#b45309;">${m.pendientes}</div>
                            <div class="rotulo">Pendientes</div>
                        </div>
                        <div class="ficha-metrica">
                            <div class="cifra" style="color:#0f172a;">${m.total}</div>
                            <div class="rotulo">Solicitudes</div>
                        </div>
                    </div>

                    ${m.urgentes > 0 ? `<div style="background:#fee2e2; color:#b91c1c; border-radius:10px; padding:8px 12px; font-size:0.85rem; font-weight:700; margin-bottom:14px;">🚨 ${m.urgentes} solicitud${m.urgentes === 1 ? '' : 'es'} urgente${m.urgentes === 1 ? '' : 's'} sin cerrar</div>` : ''}
                    ${m.canceladas > 0 ? `<div style="font-size:0.78rem; color:#94a3b8; margin:-8px 0 14px;">${m.canceladas} cancelada${m.canceladas === 1 ? '' : 's'}, fuera del conteo.</div>` : ''}

                    <div style="font-size:0.78rem; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;">Solicitudes</div>
                    <div style="border:1px solid #e2e8f0; border-radius:12px; padding:2px 12px; margin-bottom:18px;">
                        ${listaHtml}
                        ${restantes > 0 ? `<div style="font-size:0.75rem; color:#94a3b8; padding:8px 0; border-top:1px solid #f1f5f9;">y ${restantes} más…</div>` : ''}
                    </div>

                    <div style="font-size:0.78rem; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:8px;">Editar equipo</div>
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:#475569; margin-bottom:4px;">Nombre del equipo</label>
                    <input type="text" id="inp-detalle-nombre" style="width:100%; border:1px solid #cbd5e1; box-sizing:border-box; outline:none; margin-bottom:10px;">
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:#475569; margin-bottom:4px;">ID / Código interno</label>
                    <input type="text" id="inp-detalle-id-interno" style="width:100%; border:1px solid #cbd5e1; box-sizing:border-box; outline:none; margin-bottom:14px;">
                    <button id="btn-guardar-equipo" style="width:100%; background:#0ea5e9; color:white; border:none; padding:12px; border-radius:10px; font-weight:700; cursor:pointer; font-size:0.95rem;">Guardar cambios</button>
                `;

                document.getElementById('inp-detalle-nombre').value = equipo.nombre || '';
                document.getElementById('inp-detalle-id-interno').value = equipo.id_interno || '';
                document.getElementById('btn-guardar-equipo').onclick = () => guardarEquipo(equipo);

                document.getElementById('modal-detalle-activo').style.display = 'flex';
            }

            window.cerrarDetalleActivo = () => {
                document.getElementById('modal-detalle-activo').style.display = 'none';
            };

            async function guardarEquipo(equipo) {
                const boton = document.getElementById('btn-guardar-equipo');
                const nombre = document.getElementById('inp-detalle-nombre').value.trim();
                const idInterno = document.getElementById('inp-detalle-id-interno').value.trim();

                if (!nombre) {
                    alert("El nombre del equipo no puede quedar vacío.");
                    return;
                }

                const textoOriginal = boton.innerText;
                boton.innerText = "Guardando…";
                boton.disabled = true;

                try {
                    const { error } = await sb.from('equipos').update({
                        nombre: nombre,
                        id_interno: idInterno === "" ? null : idInterno
                    }).eq('id', equipo.id);

                    if (error) throw error;

                    // Se actualiza la copia local para repintar sin recargar.
                    equipo.nombre = nombre;
                    equipo.id_interno = idInterno === "" ? null : idInterno;

                    window.cerrarDetalleActivo();
                    dibujar();
                } catch (error) {
                    console.error("Error actualizando equipo:", error);
                    alert("Hubo un error de conexión al intentar guardar.");
                } finally {
                    boton.innerText = textoOriginal;
                    boton.disabled = false;
                }
            }

            function colorEstado(estado) {
                if (estado === 'Entregada' || estado === 'Recibida') return { fondo: '#dcfce7', texto: '#15803d' };
                if (estado === 'Cancelada') return { fondo: '#f1f5f9', texto: '#64748b' };
                return { fondo: '#ffedd5', texto: '#c2410c' };
            }

            function escapar(texto) {
                const div = document.createElement('div');
                div.innerText = texto === null || texto === undefined ? '' : String(texto);
                return div.innerHTML;
            }

            // El treemap se calcula contra el tamaño del lienzo, así que hay
            // que rehacerlo cuando el teléfono gira o cambia la ventana.
            let temporizadorMedida = null;
            const rehacer = () => {
                clearTimeout(temporizadorMedida);
                temporizadorMedida = setTimeout(dibujar, 120);
            };
            window.addEventListener('resize', rehacer);
            window.addEventListener('orientationchange', rehacer);
        });
    </script>
</body>
</html>
