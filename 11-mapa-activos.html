            // El panel de detalles de una solicitud —con sus notas, su foto y
            // todas sus acciones— vive en 10-refacciones.html y no se copia
            // aquí: el mapa manda a esa pantalla diciéndole cuál abrir.
            window.abrirSolicitudEnPanel = (idSolicitud) => {
                window.irAPantalla('10-refacciones.html?solicitud=' + encodeURIComponent(idSolicitud));
            };

            function esMia(req, campo) {
                return !!miFicha && personaDe(req[campo]).clave === miFicha.clave;
            }

            // Lo que puede hacer con esta solicitud quien tiene la sesión
            // abierta, sin salir del mapa. Las mismas dos acciones del panel y
            // con las mismas reglas: quien la atiende la da por entregada
            // mientras siga pendiente, y quien la pidió acusa el recibo hasta
            // que esté cerrada.
            //
            // Si es las dos cosas —se atiende su propia solicitud— gana la de
            // solicitante: 'Recibida' cierra el ciclo entero y se ahorra el
            // paso intermedio.
            function accionSobreSolicitud(req) {
                if (!miFicha || req.estado === 'Cancelada') return null;

                if (esMia(req, 'solicitante_id') && (req.estado === 'Pendiente' || req.estado === 'Entregada')) {
                    return {
                        estado: 'Recibida',
                        titulo: 'La pediste tú: marcar como recibida',
                        aria: 'Marcar esta solicitud como recibida',
                        pregunta: "✅ ¿Confirmas que ya recibiste esta refacción en tus manos y deseas cerrar la solicitud?"
                    };
                }
                if (esMia(req, 'atendido_por_id') && req.estado === 'Pendiente') {
                    return {
                        estado: 'Entregada',
                        titulo: 'La atiendes tú: marcar como entregada',
                        aria: 'Marcar esta solicitud como entregada',
                        pregunta: "📦 ¿Confirmas que ya entregaste esta refacción al solicitante?"
                    };
                }
                return null;
            }

            // La etiqueta de estado hace además de botón cuando hay algo que
            // pulsar. Ir a un control aparte costaría el ancho que en un
            // teléfono le queda al nombre de la pieza.
            function bloqueEstado(req, colores) {
                const texto = escapar(req.estado || 'Pendiente');
                const estilo = `background:${colores.fondo}; color:${colores.texto};`;
                const accion = accionSobreSolicitud(req);

                if (!accion) {
                    return `<span class="etiqueta-estado" style="${estilo}">${texto}</span>`;
                }
                return `<button onclick="event.stopPropagation(); window.avanzarSolicitudEnMapa('${escapar(String(req.id))}')"
                                class="etiqueta-estado" style="${estilo}"
                                title="${escapar(accion.titulo)}"
                                aria-label="${escapar(accion.aria)}">${texto} ✓</button>`;
            }

            window.avanzarSolicitudEnMapa = async (idSolicitud) => {
                const solicitud = refacciones.find(r => String(r.id) === String(idSolicitud));
                // La acción se vuelve a resolver aquí y no se pasa en el onclick:
                // entre que se dibujó el renglón y el toque pudo cambiar el
                // reparto o el estado, y lo que se escribe tiene que salir de lo
                // que la solicitud es ahora.
                const accion = solicitud ? accionSobreSolicitud(solicitud) : null;
                if (!accion) return;
                if (!confirm(accion.pregunta)) return;

                try {
                    const { data, error } = await sb.from('refacciones')
                        .update({ estado: accion.estado })
                        .eq('id', solicitud.id)
                        .select('id');

                    if (error) throw error;

                    // Cero filas es lo que contesta una escritura que las
                    // políticas de la base no permiten, y llega sin error.
                    if (!data || data.length === 0) {
                        alert("La base no aplicó el cambio: no se modificó ninguna fila.\n\nRevisa los permisos de escritura (RLS) de la tabla refacciones.");
                        return;
                    }

                    solicitud.estado = accion.estado;
                    agregarMetricas();
                    dibujar();
                    refrescarDetalle();
                } catch (error) {
                    console.error("Error al cambiar el estado de la solicitud:", error);
                    alert("Hubo un error de conexión al intentar cambiar el estado de la solicitud.");
                }
            };

            // El bloque de solicitudes, con su tope de ocho y su «ver las
            // restantes». El botón de mover es cosa de la vista de activos: en
            // la hoja de una persona no se está mirando ningún equipo al que
            // corregirle la solicitud.
            function bloqueSolicitudes(solicitudes, tipo, textoVacio) {
                const visibles = detalleVerTodas ? solicitudes : solicitudes.slice(0, 8);
                const restantes = solicitudes.length - visibles.length;

                const listaHtml = visibles.length === 0
                    ? `<div style="color:#94a3b8; font-style:italic; font-size:0.85rem; padding:8px 0;">${textoVacio}</div>`
                    : visibles.map(req => {
                        const colores = colorEstado(req.estado);
                        const fecha = req.created_at
                            ? new Date(req.created_at).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' })
                            : '';
                        const urgente = req.prioridad === 'Urgente' && !CERRADOS.includes(req.estado) && req.estado !== 'Cancelada';
                        // El contexto va en su propio renglón y no pegado a la
                        // cantidad: es el dato por el que se abre la hoja, y ahí
                        // detrás de la fecha se lo comían los puntos suspensivos.
                        const contexto = contextoDeSolicitud(req, tipo);
                        // El renglón entero abre la solicitud. Los controles que
                        // lleva dentro paran el evento para que tocarlos no se
                        // lleve además la pantalla por delante.
                        return `
                            <div class="renglon-solicitud renglon-solicitud--abrible" role="button" tabindex="0"
                                 onclick="window.abrirSolicitudEnPanel('${escapar(String(req.id))}')"
                                 onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); window.abrirSolicitudEnPanel('${escapar(String(req.id))}'); }"
                                 title="Ver los detalles de la solicitud">
                                <div style="min-width:0;">
                                    <div style="font-weight:600; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${urgente ? '🚨 ' : ''}${escapar(req.nombre_refaccion || 'Sin nombre')}</div>
                                    ${contexto ? `<div style="font-size:0.75rem; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${contexto}</div>` : ''}
                                    <div style="font-size:0.75rem; color:#94a3b8;">${escapar(String(req.cantidad || ''))} ${escapar(req.unidad || '')} · ${fecha}</div>
                                </div>
                                <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                                    ${bloqueAtendedor(req)}
                                    ${bloqueEstado(req, colores)}
                                    ${tipo === 'equipo' && puedoAdministrar ? `<button onclick="event.stopPropagation(); window.abrirMoverSolicitud('${escapar(String(req.id))}')" class="ios-boton-icono" title="Mover a otro equipo" aria-label="Mover a otro equipo" style="width:30px; height:30px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg></button>` : ''}
                                </div>
                            </div>`;
                    }).join('');

                return `
                    <div style="font-size:0.78rem; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;">Solicitudes</div>
                    <div style="border:1px solid #e2e8f0; border-radius:12px; padding:2px 12px; margin-bottom:18px;">
                        ${listaHtml}
                        ${restantes > 0 ? `<button onclick="window.verTodasLasSolicitudes()" style="width:100%; font-size:0.78rem; color:#0284c7; font-weight:700; padding:9px 0; border:none; border-top:1px solid #f1f5f9; background:transparent; cursor:pointer; text-align:left;">Ver las ${restantes} restantes…</button>` : ''}
                    </div>`;
            }

            // Las tres cifras y los avisos. El de "sin confirmar" cambia de
            // texto según la hoja porque cambia a quién hay que reclamarle.
            function bloqueResumen(m, avisoSinConfirmar) {
                const pct = m.total ? Math.round((m.cerradas / m.total) * 100) : null;
                return `
                    <div style="display:flex; gap:8px; margin-bottom:14px;">
                        <div class="ficha-metrica">
                            <div class="cifra" style="color:${COLOR_TEXTO};">${pct === null ? '—' : pct + '%'}</div>
                            <div class="rotulo">Entregadas</div>
                        </div>
                        <div class="ficha-metrica">
                            <div class="cifra" style="color:#b45309;">${m.pendientes}</div>
                            <div class="rotulo">Pendientes</div>
                        </div>
                        <div class="ficha-metrica">
                            <div class="cifra" style="color:#0f172a;">${m.total}</div>
                            <div class="rotulo">Solicitudes</div>
                        </div>
                    </div>

                    ${m.urgentes > 0 ? `<div style="background:#fee2e2; color:#b91c1c; border-radius:10px; padding:8px 12px; font-size:0.85rem; font-weight:700; margin-bottom:14px;">🚨 ${m.urgentes} solicitud${m.urgentes === 1 ? '' : 'es'} urgente${m.urgentes === 1 ? '' : 's'} sin cerrar</div>` : ''}
                    ${m.sinConfirmar > 0 ? `<div style="background:#fef3c7; color:#92400e; border-radius:10px; padding:8px 12px; font-size:0.85rem; margin-bottom:14px;"><b>📦 ${m.sinConfirmar} entregada${m.sinConfirmar === 1 ? '' : 's'} sin confirmar.</b> ${avisoSinConfirmar}</div>` : ''}
                    ${m.canceladas > 0 ? `<div style="font-size:0.78rem; color:#94a3b8; margin:-8px 0 14px;">${m.canceladas} cancelada${m.canceladas === 1 ? '' : 's'}, fuera del conteo.</div>` : ''}`;
            }

            function pintarDetalleEquipo() {
                const nodo = nodoDetalle;
                const filas = filasDelDetalle();

                if (filas.length === 0) return false;

                const solicitudes = ordenarSolicitudes(filas
                    .reduce((acc, f) => acc.concat(solicitudesPorEquipo.get(String(f.id)) || []), []));

                const marcas = [];
                if (filas.length > 1) marcas.push(`${filas.length} altas en esta línea`);
                if (filas.every(e => e.activo === false)) marcas.push('Dado de baja');

                // Renombrar una máquina y unir sus altas repetidas cambia el
                // catálogo para toda la empresa, así que va con el mismo permiso
                // que el reparto.
                document.getElementById('btn-editar-equipo').style.display = puedoAdministrar ? '' : 'none';
                document.getElementById('detalle-titulo').innerText = nodo.subtitulo || nodo.titulo;
                document.getElementById('detalle-subtitulo').innerText =
                    [ruta.map(p => p.titulo).join(' › ')].concat(marcas).join(' · ');

                document.getElementById('detalle-cuerpo').innerHTML = `
                    ${bloqueResumen(nodo.metrica, 'La refacción ya se entregó y falta que quien la pidió la marque como recibida.')}
                    ${bloqueSolicitudes(solicitudes, 'equipo', 'Este equipo todavía no tiene solicitudes.')}

                    ${filas.length > 1 ? `
                    <div style="background:#fff7ed; color:#9a3412; border-radius:10px; padding:8px 12px; font-size:0.82rem;">
                        Esta máquina está dada de alta ${filas.length} veces en la línea y el cuadro las suma.
                        Se unen desde el botón de editar.
                    </div>` : ''}
                `;

                return true;
            }

            function pintarDetallePersona() {
                const nodo = nodoDetalle;
                const entrada = (vista === 'atendedores' ? atendedores : solicitantes).get(nodo.id);
                if (!entrada) return false;

                const esAtendedor = vista === 'atendedores';
                const solicitudes = ordenarSolicitudes(entrada.solicitudes);

                // Sin nombre la hoja no es de una persona sino de un cajón, y
                // el subtítulo tiene que decir de qué cajón se trata.
                let subtitulo;
                if (nodo.id === SIN_PERSONA) {
                    subtitulo = esAtendedor
                        ? 'Solicitudes que nadie ha tomado'
                        : 'Solicitudes sin solicitante registrado';
                } else {
                    subtitulo = [esAtendedor ? 'Atiende' : 'Solicitante']
                        .concat(entrada.depto === SIN_DEPTO ? [] : [entrada.depto])
                        .join(' · ');
                }

                document.getElementById('btn-editar-equipo').style.display = 'none';
                document.getElementById('detalle-titulo').innerText = entrada.nombre || nodo.titulo;
                document.getElementById('detalle-subtitulo').innerText = subtitulo;

                // Ojo con el nombre: 'aviso' es el letrero del lienzo, que vive
                // en el mismo cierre y lo usa dibujar().
                const avisoConfirmar = esAtendedor
                    ? 'Ya las entregó y falta que quien las pidió las marque como recibidas.'
                    : 'Ya tiene la refacción en la mano y falta que la marque como recibida.';

                document.getElementById('detalle-cuerpo').innerHTML = `
                    ${bloqueResumen(entrada.metrica, avisoConfirmar)}
                    ${bloqueSolicitudes(solicitudes, 'persona', 'Sin solicitudes.')}
                `;

                return true;
            }

            window.cerrarDetalleActivo = () => {
                nodoDetalle = null;
                // Las hojas de edición y de reparto salen de ésta y nunca le
                // sobreviven: si el detalle se cierra solo (al unir altas, al
                // guardar, al quedarse una persona sin solicitudes) se quedarían
                // flotando sobre el mapa sin dueño.
                window.cerrarEdicionEquipo();
                window.cerrarAsignarAtendedor();
                document.getElementById('modal-detalle-activo').style.display = 'none';
            };

            // ==========================================
            // Hoja de edición del equipo
            // ==========================================
            // Los campos viven aparte para que el detalle sea sólo de
            // consulta. Se arma al abrir, contra las filas que el detalle
            // tenga en ese momento, y se desmonta al cerrar: así los ids de
            // los campos existen una sola vez y el buscador de ID no queda
            // enganchado a un equipo que ya no se está mirando.
            function filasDelDetalle() {
                if (!nodoDetalle) return [];
                return nodoDetalle.ids
                    .map(id => equipos.find(e => String(e.id) === String(id)))
                    .filter(Boolean);
            }

            // El botón de guardar es de icono y no tiene texto que cambiar a
            // «Guardando…», así que el aviso va al subtítulo del encabezado,
            // que el resto del tiempo enseña el nombre de la máquina, y el
            // botón se apaga mientras tanto.
            let nombreEnEdicion = '';

            function estadoEdicionEquipo(texto) {
                const boton = document.getElementById('btn-guardar-equipo');
                document.getElementById('editar-subtitulo').innerText = texto || nombreEnEdicion;
                boton.disabled = !!texto;
                boton.style.opacity = texto ? '0.45' : '';
            }

            window.abrirEdicionEquipo = () => {
                if (!puedoAdministrar) return;
                const filas = filasDelDetalle();
                if (filas.length === 0) return;

                const principal = filas.find(e => String(e.id_interno || '').trim()) || filas[0];

                nombreEnEdicion = principal.nombre || 'Sin nombre';
                estadoEdicionEquipo('');

                document.getElementById('editar-cuerpo').innerHTML = `
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:#475569; margin:14px 0 4px;">ID / Código interno</label>
                    <input type="text" id="inp-detalle-id" autocomplete="off" autocapitalize="characters" placeholder="Busca un ID o escribe uno nuevo" style="width:100%; border:1px solid #cbd5e1; box-sizing:border-box; outline:none;">
                    <div id="sugerencias-id"></div>
                    <div id="nota-detalle-id" style="font-size:0.78rem; color:#64748b; margin:6px 0 12px;"></div>
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:#475569; margin-bottom:4px;">Nombre del equipo</label>
                    <input type="text" id="inp-detalle-nombre" style="width:100%; border:1px solid #cbd5e1; box-sizing:border-box; outline:none;">

                    ${filas.length > 1 ? `
                    <div style="font-size:0.78rem; font-weight:700; color:#475569; text-transform:uppercase; letter-spacing:0.4px; margin:22px 0 6px;">Altas repetidas</div>
                    <div style="border:1px solid #e2e8f0; border-radius:12px; padding:12px;">
                        <div style="font-size:0.82rem; color:#475569; margin-bottom:4px;">
                            Esta máquina está dada de alta ${filas.length} veces en la línea y el cuadro las suma.
                            Elige cuál se queda: las demás le ceden sus solicitudes y después se borran.
                        </div>
                        <div id="lista-altas"></div>
                        <button id="btn-unir-altas" style="width:100%; margin-top:12px; background:#fff1f2; color:#be123c; border:1px solid #fecdd3; padding:10px; border-radius:10px; font-weight:700; cursor:pointer; font-size:0.9rem;">Unir en la seleccionada</button>
                    </div>` : ''}
                `;

                document.getElementById('inp-detalle-nombre').value = principal.nombre || '';
                montarBuscadorDeId(principal);
                montarAltasRepetidas(filas);

                document.getElementById('modal-editar-equipo').style.display = 'flex';
            };

            // Guardar vive en el encabezado, en marcado fijo, así que no puede
            // llevar las filas en un onclick que se rehaga al abrir: se vuelven
            // a leer del detalle, que es de donde salieron.
            window.guardarEdicionEquipo = () => {
                if (!puedoAdministrar) return;
                const filas = filasDelDetalle();
                if (filas.length > 0) guardarEquipo(filas);
            };

            window.cerrarEdicionEquipo = () => {
                document.getElementById('modal-editar-equipo').style.display = 'none';
                document.getElementById('editar-cuerpo').innerHTML = '';
                estadoEdicionEquipo('');
            };

            // ==========================================
            // Mover una solicitud a otro equipo
            // ==========================================
            // Los destinos se agrupan igual que el mapa: uno por máquina y
            // línea, no uno por fila. Si la máquina tiene varias altas, la
            // solicitud va a la que más carga lleva, que es la que sobrevive
            // cuando se unen.
            function nombreDePlanta(clave) {
                if (clave === SIN_PLANTA) return 'Sin planta';
                const planta = plantas.find(p => String(p.id) === clave);
                return planta ? planta.nombre : 'Sin planta';
            }

            function nombreDeLinea(clave) {
                if (clave === SIN_LINEA) return 'Sin línea';
                const linea = lineas.find(l => String(l.id) === clave);
                return linea ? linea.nombre : 'Sin línea';
            }

            function destinosPosibles() {
                const grupos = new Map();

                equipos.forEach(e => {
                    const clavePlanta = plantaDeEquipo(e);
                    const claveLinea = lineaDeEquipo(e);
                    const clave = clavePlanta + '|' + claveLinea + '|' + claveDeEquipo(e);
                    if (!grupos.has(clave)) grupos.set(clave, { clavePlanta, claveLinea, filas: [] });
                    grupos.get(clave).filas.push(e);
                });

                return Array.from(grupos.values()).map(grupo => {
                    const filas = grupo.filas;
                    const principal = filas.slice().sort((a, b) =>
                        solicitudesDe(b).length - solicitudesDe(a).length || Number(a.id) - Number(b.id))[0];
                    const conId = filas.find(e => String(e.id_interno || '').trim());
                    const idInterno = conId ? String(conId.id_interno).trim() : '';
                    const nombre = (filas.find(e => e.nombre) || filas[0]).nombre || 'Sin nombre';

                    return {
                        id: principal.id,
                        ids: filas.map(f => String(f.id)),
                        titulo: idInterno ? `${idInterno} · ${nombre}` : nombre,
                        ubicacion: `${nombreDePlanta(grupo.clavePlanta)} › ${nombreDeLinea(grupo.claveLinea)}`
                    };
                }).sort((a, b) => a.titulo.localeCompare(b.titulo));
            }

            window.abrirMoverSolicitud = (idSolicitud) => {
                // La comprobación se repite aquí y no sólo al pintar el botón:
                // estas funciones cuelgan de window y el renglón que las llama
                // se rehace en cada repintado.
                if (!puedoAdministrar) return;
                const solicitud = refacciones.find(r => String(r.id) === String(idSolicitud));
                if (!solicitud) return;

                const destinos = destinosPosibles();
                const campo = document.getElementById('inp-buscar-destino');
                const lista = document.getElementById('lista-destinos');

                document.getElementById('mover-subtitulo').innerText =
                    solicitud.nombre_refaccion || 'Solicitud sin nombre';

                const pintar = () => {
                    const busca = normalizarBusqueda(campo.value);
                    const encontrados = busca
                        ? destinos.filter(d => normalizarBusqueda(d.titulo).includes(busca) ||
                                               normalizarBusqueda(d.ubicacion).includes(busca))
                        : destinos;

                    lista.innerHTML = '';

                    if (encontrados.length === 0) {
                        const vacio = document.createElement('div');
                        vacio.style.cssText = 'padding:16px 25px; color:#94a3b8; font-style:italic;';
                        vacio.innerText = 'Ningún equipo coincide.';
                        lista.appendChild(vacio);
                        return;
                    }

                    encontrados.forEach(destino => {
                        const esActual = destino.ids.includes(String(solicitud.equipo_id));

                        const fila = document.createElement('button');
                        fila.className = 'destino-mover';
                        fila.type = 'button';
                        fila.disabled = esActual;

                        const arriba = document.createElement('div');
                        arriba.style.cssText = 'font-weight:700; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                        arriba.innerText = destino.titulo;
                        const abajo = document.createElement('div');
                        abajo.style.cssText = 'font-size:0.78rem; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                        abajo.innerText = esActual ? `${destino.ubicacion} · donde está ahora` : destino.ubicacion;

                        fila.appendChild(arriba);
                        fila.appendChild(abajo);
                        if (!esActual) fila.onclick = () => moverSolicitud(solicitud, destino);
                        lista.appendChild(fila);
                    });
                };

                campo.value = '';
                campo.oninput = pintar;
                pintar();

                // El alto se limita aquí y no en el CSS porque la hoja crece
                // con su contenido: sin tope, una lista larga la deja sin
                // sitio para el buscador.
                lista.style.maxHeight = Math.round(window.innerHeight * 0.5) + 'px';
                document.getElementById('modal-mover-solicitud').style.display = 'flex';
            };

            window.cerrarMoverSolicitud = () => {
                document.getElementById('modal-mover-solicitud').style.display = 'none';
            };

            async function moverSolicitud(solicitud, destino) {
                const lista = document.getElementById('lista-destinos');
                lista.style.pointerEvents = 'none';

                try {
                    const { error } = await sb.from('refacciones')
                        .update({ equipo_id: destino.id })
                        .eq('id', solicitud.id);

                    if (error) throw error;

                    solicitud.equipo_id = destino.id;
                    agregarMetricas();
                    window.cerrarMoverSolicitud();
                    dibujar();
                    // La hoja se queda abierta y con los números al día, para
                    // poder mover varias solicitudes seguidas.
                    refrescarDetalle();
                } catch (error) {
                    console.error("Error moviendo la solicitud:", error);
                    alert("Hubo un error de conexión al intentar mover la solicitud.");
                } finally {
                    lista.style.pointerEvents = '';
                }
            }

            // ==========================================
            // Repartir una solicitud entre atendedores
            // ==========================================
            // Quién puede atender: sólo quien está marcado con permiso, es decir
            // quien lleva alguno de los encargos autorizados en «Configurar
            // permisos». No vale el resto de la plantilla, ni siquiera quien ya
            // atiende alguna solicitud de antes: si le quitaron el encargo, no
            // se le reparte nada nuevo. El único que aparece sin cumplirlo es el
            // que ya la atiende, y sale desactivado, para poder ver quién es.
            function atendedoresPosibles(solicitud) {
                const vistos = new Set();
                const lista = [];

                const agregar = (ficha, nota) => {
                    if (!ficha || !ficha.nombre || vistos.has(ficha.clave)) return;
                    vistos.add(ficha.clave);
                    lista.push({ ficha, nota });
                };

                agregar(personaDe(solicitud.atendido_por_id), 'La atiende ahora');

                plantilla
                    .filter(atiendeRefacciones)
                    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
                    .forEach(f => agregar(f, f.depto === SIN_DEPTO ? '' : f.depto));

                return lista;
            }

            window.abrirAsignarAtendedor = (idSolicitud) => {
                if (!puedoAdministrar) return;
                const solicitud = refacciones.find(r => String(r.id) === String(idSolicitud));
                if (!solicitud) return;

                const candidatos = atendedoresPosibles(solicitud);
                const campo = document.getElementById('inp-buscar-atendedor');
                const lista = document.getElementById('lista-atendedores');
                const actual = personaDe(solicitud.atendido_por_id);

                document.getElementById('asignar-subtitulo').innerText =
                    solicitud.nombre_refaccion || 'Solicitud sin nombre';

                const pintar = () => {
                    const busca = normalizarBusqueda(campo.value);
                    const encontrados = busca
                        ? candidatos.filter(c => normalizarBusqueda(c.ficha.nombre).includes(busca) ||
                                                 normalizarBusqueda(c.ficha.depto).includes(busca))
                        : candidatos;

                    lista.innerHTML = '';

                    // Dejarla sin dueño es una opción, y sólo aparece cuando hay
                    // dueño que quitar.
                    if (actual.nombre && !busca) {
                        const quitar = document.createElement('button');
                        quitar.className = 'destino-mover';
                        quitar.type = 'button';
                        const texto = document.createElement('div');
                        texto.style.cssText = 'font-weight:700; color:#be123c;';
                        texto.innerText = 'Dejar sin asignar';
                        quitar.appendChild(texto);
                        quitar.onclick = () => asignarAtendedor(solicitud, null);
                        lista.appendChild(quitar);
                    }

                    if (encontrados.length === 0) {
                        const vacio = document.createElement('div');
                        vacio.style.cssText = 'padding:16px 25px; color:#94a3b8; font-style:italic;';
                        vacio.innerText = candidatos.length === 0
                            ? 'Nadie tiene todavía un encargo con permiso para atender refacciones. Se marcan en el panel, en Configurar permisos.'
                            : 'Nadie coincide.';
                        lista.appendChild(vacio);
                        return;
                    }

                    encontrados.forEach(({ ficha, nota }) => {
                        const esActual = ficha.clave === actual.clave && !!actual.nombre;

                        const fila = document.createElement('button');
                        fila.className = 'destino-mover';
                        fila.type = 'button';
                        fila.disabled = esActual;

                        const arriba = document.createElement('div');
                        arriba.style.cssText = 'font-weight:700; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                        arriba.innerText = ficha.nombre;
                        const abajo = document.createElement('div');
                        abajo.style.cssText = 'font-size:0.78rem; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                        abajo.innerText = esActual ? 'La atiende ahora' : nota;

                        fila.appendChild(arriba);
                        if (abajo.innerText) fila.appendChild(abajo);
                        if (!esActual) fila.onclick = () => asignarAtendedor(solicitud, ficha.clave);
                        lista.appendChild(fila);
                    });
                };

                campo.value = '';
                campo.oninput = pintar;
                pintar();

                lista.style.maxHeight = Math.round(window.innerHeight * 0.5) + 'px';
                document.getElementById('modal-asignar-atendedor').style.display = 'flex';
            };

            window.cerrarAsignarAtendedor = () => {
                document.getElementById('modal-asignar-atendedor').style.display = 'none';
            };

            async function asignarAtendedor(solicitud, clave) {
                const lista = document.getElementById('lista-atendedores');
                lista.style.pointerEvents = 'none';

                let miId = null;
                try {
                    const sesion = JSON.parse(localStorage.getItem("usuarioLogueado"));
                    if (sesion && sesion.id) miId = String(sesion.id).trim();
                } catch (e) {}

                try {
                    // Quien asigna queda registrado, igual que en el panel; al
                    // dejarla sin dueño se borra también esa firma.
                    const { data, error } = await sb.from('refacciones')
                        .update({ atendido_por_id: clave, asignado_por_id: clave ? miId : null })
                        .eq('id', solicitud.id)
                        .select('id');

                    if (error) throw error;

                    // El .select() no es decorativo: una escritura que las
                    // políticas de la base no permiten contesta con éxito y cero
                    // filas, y sin contarlas la pantalla se quedaría enseñando un
                    // cambio que nunca ocurrió.
                    if (!data || data.length === 0) {
                        alert("La base no aplicó el cambio: no se modificó ninguna fila.\n\nRevisa los permisos de escritura (RLS) de la tabla refacciones.");
                        return;
                    }

                    solicitud.atendido_por_id = clave;
                    agregarMetricas();
                    window.cerrarAsignarAtendedor();
                    dibujar();
                    refrescarDetalle();
                } catch (error) {
                    console.error("Error al asignar la solicitud:", error);
                    alert("Hubo un error de conexión al intentar cambiar quién atiende.");
                } finally {
                    lista.style.pointerEvents = '';
                }
            }

            function solicitudesDe(fila) {
                return solicitudesPorEquipo.get(String(fila.id)) || [];
            }

            // Las altas se ofrecen ordenadas por carga: la que más
            // solicitudes tiene viene marcada, que es la que menos registros
            // obliga a mover, pero la elección es de quien mira la pantalla.
            function montarAltasRepetidas(filas) {
                const contenedor = document.getElementById('lista-altas');
                if (!contenedor) return;
                contenedor.innerHTML = '';

                const ordenadas = filas.slice().sort((a, b) =>
                    solicitudesDe(b).length - solicitudesDe(a).length || Number(a.id) - Number(b.id));

                ordenadas.forEach((fila, i) => {
                    const etiqueta = document.createElement('label');
                    etiqueta.className = 'alta-repetida';

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'alta-superviviente';
                    radio.value = String(fila.id);
                    radio.checked = i === 0;

                    const textos = document.createElement('div');
                    textos.style.cssText = 'min-width:0;';
                    const arriba = document.createElement('div');
                    arriba.style.cssText = 'font-weight:700; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                    arriba.innerText = `${fila.id_interno || 'Sin ID'} · ${fila.nombre || 'Sin nombre'}`;
                    const abajo = document.createElement('div');
                    abajo.style.cssText = 'font-size:0.78rem; color:#64748b;';
                    const cuantas = solicitudesDe(fila).length;
                    abajo.innerText = `${cuantas === 0 ? 'Sin solicitudes' : cuantas + (cuantas === 1 ? ' solicitud' : ' solicitudes')} · alta #${fila.id}`;
                    textos.appendChild(arriba);
                    textos.appendChild(abajo);

                    etiqueta.appendChild(radio);
                    etiqueta.appendChild(textos);
                    contenedor.appendChild(etiqueta);
                });

                document.getElementById('btn-unir-altas').onclick = () => unirAltas(filas);
            }

            // Unir es destructivo, así que el orden importa: primero las
            // solicitudes cambian de dueño, después se comprueba contra la
            // base que no quedó ninguna colgando, y sólo entonces se borran
            // las filas. Si el borrado falla, las solicitudes ya están a
            // salvo en el alta que se queda y no se perdió nada.
            async function unirAltas(filas) {
                if (!puedoAdministrar) return;
                const boton = document.getElementById('btn-unir-altas');
                const elegido = document.querySelector('input[name="alta-superviviente"]:checked');
                if (!elegido) return;

                const superviviente = filas.find(f => String(f.id) === elegido.value);
                const sobrantes = filas.filter(f => String(f.id) !== elegido.value);
                if (!superviviente || sobrantes.length === 0) return;

                const porMover = sobrantes.reduce((n, f) => n + solicitudesDe(f).length, 0);
                const aviso = `Se moverán ${porMover} solicitudes al alta #${superviviente.id} ` +
                    `y se borrarán las otras ${sobrantes.length}.\n\nEsto no se puede deshacer.`;
                if (!confirm(aviso)) return;

                const idsSobrantes = sobrantes.map(f => f.id);
                const textoOriginal = boton.innerText;
                boton.innerText = "Uniendo…";
                boton.disabled = true;

                try {
                    const { error: errorMover } = await sb.from('refacciones')
                        .update({ equipo_id: superviviente.id })
                        .in('equipo_id', idsSobrantes);

                    if (errorMover) throw errorMover;

                    // La comprobación va contra la base y no contra la copia
                    // local: entre que se cargó la pantalla y ahora pudo
                    // entrar una solicitud nueva en una de esas altas.
                    const { data: rezagadas, error: errorRevisar } = await sb.from('refacciones')
                        .select('id')
                        .in('equipo_id', idsSobrantes);

                    if (errorRevisar) throw errorRevisar;

                    if (rezagadas && rezagadas.length > 0) {
                        alert(`No se borró nada: siguen colgando ${rezagadas.length} solicitudes de las altas sobrantes. Inténtalo otra vez.`);
                        return;
                    }

                    // El .select() no es decorativo: sin él no hay forma de
                    // saber si el borrado ocurrió. Un delete que las políticas
                    // de la base no permiten NO devuelve error, borra cero
                    // filas y contesta con éxito, así que dar por bueno el
                    // "sin error" hacía que la pantalla dijera que los
                    // duplicados se habían ido y volvieran al recargar.
                    const { data: borradas, error: errorBorrar } = await sb.from('equipos')
                        .delete()
                        .in('id', idsSobrantes)
                        .select('id');

                    const seFueron = new Set((borradas || []).map(b => String(b.id)));

                    // Se avisa y se sigue: las solicitudes ya están movidas y
                    // esa parte no hay que deshacerla.
                    if (errorBorrar) {
                        console.error("Error borrando las altas sobrantes:", errorBorrar);
                        alert("Las solicitudes ya quedaron en el alta elegida, pero no se pudieron borrar las filas sobrantes:\n\n" +
                              (errorBorrar.message || errorBorrar) +
                              "\n\nNo se perdió nada. Hay que quitarlas desde Supabase.");
                    } else if (seFueron.size < idsSobrantes.length) {
                        console.warn("El borrado no alcanzó a todas las altas sobrantes:", idsSobrantes, borradas);
                        alert(`Las ${porMover} solicitudes ya quedaron en el alta #${superviviente.id}, pero la base no borró ` +
                              `${idsSobrantes.length - seFueron.size} de las ${idsSobrantes.length} filas sobrantes.\n\n` +
                              "No dio error: simplemente no borró nada, que es lo que pasa cuando a la tabla " +
                              "equipos le falta permiso de borrado en Supabase.\n\n" +
                              "No se perdió nada. El script sql/politica-borrado-equipos.sql lo arregla.");
                    }

                    // Copia local al día para repintar sin recargar. Sólo se
                    // quitan las filas que la base confirmó haber borrado, o
                    // la pantalla mentiría hasta la siguiente recarga.
                    const sobra = new Set(idsSobrantes.map(String));
                    refacciones.forEach(r => {
                        if (sobra.has(String(r.equipo_id))) r.equipo_id = superviviente.id;
                    });
                    equipos = equipos.filter(e => !seFueron.has(String(e.id)));

                    agregarMetricas();
                    window.cerrarDetalleActivo();
                    dibujar();
                } catch (error) {
                    console.error("Error uniendo las altas:", error);
                    alert("Hubo un error de conexión al intentar unir las altas.");
                } finally {
                    boton.innerText = textoOriginal;
                    boton.disabled = false;
                }
            }

            // El ID se busca escribiendo: la lista de equipos es larga y un
            // desplegable obliga a recorrerla entera. El mismo campo sirve
            // para elegir uno que ya existe y para crear uno nuevo; lo que se
            // escriba y no coincida con ninguno es un ID nuevo, y vaciarlo
            // deja al equipo sin ID.
            function montarBuscadorDeId(equipo) {
                const catalogo = catalogoIdsInternos();
                const fichas = Array.from(catalogo.values()).sort((a, b) => a.id.localeCompare(b.id));

                const campo = document.getElementById('inp-detalle-id');
                const lista = document.getElementById('sugerencias-id');
                const inpNombre = document.getElementById('inp-detalle-nombre');
                const nota = document.getElementById('nota-detalle-id');

                const fichaActual = catalogo.get(claveDeId(equipo.id_interno));
                campo.value = fichaActual ? fichaActual.id : (equipo.id_interno || '');

                // Se busca por ID y también por nombre: quien conoce la
                // máquina pero no su matrícula la encuentra igual.
                const filtrar = (texto) => {
                    const busca = normalizarBusqueda(texto);
                    if (!busca) return fichas;
                    return fichas
                        .filter(f => normalizarBusqueda(f.id).includes(busca) ||
                                     normalizarBusqueda(f.nombre).includes(busca))
                        // Lo que empieza por lo escrito va primero: es lo que
                        // se espera al teclear las primeras letras del ID.
                        .sort((a, b) => {
                            const pa = normalizarBusqueda(a.id).startsWith(busca) ? 0 : 1;
                            const pb = normalizarBusqueda(b.id).startsWith(busca) ? 0 : 1;
                            return pa - pb || a.id.localeCompare(b.id);
                        });
                };

                // Avisa de lo que va a pasar antes de guardar: a cuántas altas
                // alcanza el nombre y si el ID escrito ya existía.
                const refrescarNota = () => {
                    const id = idInternoElegido();
                    if (!id) {
                        nota.innerText = 'Sin ID interno: el nombre sólo afecta a este equipo.';
                        return;
                    }
                    const ficha = catalogo.get(claveDeId(id));
                    if (!ficha) {
                        // Con sugerencias a la vista, decir sólo que es nuevo
                        // despista: lo escrito puede ser una búsqueda a medias.
                        nota.innerText = filtrar(id).length > 0
                            ? `«${id}» es un ID nuevo; toca una sugerencia si buscabas uno de la lista.`
                            : `«${id}» es un ID nuevo.`;
                        return;
                    }
                    let texto = ficha.cuantos === 1
                        ? `«${ficha.id}» ya existe, en un equipo llamado «${ficha.nombre}».`
                        : `«${ficha.id}» lo usan ${ficha.cuantos} altas de equipo; el nombre se guardará en todas.`;
                    if (ficha.discrepa) texto += ' Hoy no todos se llaman igual.';
                    nota.innerText = texto;
                };


                const TOPE = 8;

                // 'todas' se usa al enfocar: el campo llega con el ID puesto y
                // filtrar por él dejaría a la vista sólo ese, que es justo el
                // que se quiere cambiar.
                const pintarSugerencias = (todas) => {
                    const encontradas = todas ? fichas : filtrar(campo.value);
                    lista.innerHTML = '';

                    if (encontradas.length === 0) {
                        const vacio = document.createElement('div');
                        vacio.style.cssText = 'padding:10px 12px; color:#94a3b8; font-size:0.85rem;';
                        vacio.innerText = 'Ningún ID coincide; al guardar se creará.';
                        lista.appendChild(vacio);
                        lista.style.display = 'block';
                        return;
                    }

                    encontradas.slice(0, TOPE).forEach(ficha => {
                        const fila = document.createElement('button');
                        fila.className = 'sugerencia-id';
                        fila.type = 'button';

                        const textos = document.createElement('div');
                        textos.style.cssText = 'min-width:0;';
                        const arriba = document.createElement('div');
                        arriba.style.cssText = 'font-weight:700; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                        arriba.innerText = ficha.id;
                        const abajo = document.createElement('div');
                        abajo.style.cssText = 'font-size:0.78rem; color:#64748b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
                        abajo.innerText = ficha.nombre || 'Sin nombre';
                        textos.appendChild(arriba);
                        textos.appendChild(abajo);

                        const cuenta = document.createElement('div');
                        cuenta.style.cssText = 'flex-shrink:0; font-size:0.75rem; color:#94a3b8;';
                        cuenta.innerText = ficha.cuantos > 1 ? `${ficha.cuantos} altas` : '';

                        fila.appendChild(textos);
                        fila.appendChild(cuenta);

                        fila.onclick = () => {
                            campo.value = ficha.id;
                            // Elegir un ID que ya existe trae su nombre: es
                            // justamente lo que significa que estén ligados.
                            inpNombre.value = ficha.nombre;
                            lista.style.display = 'none';
                            refrescarNota();
                        };

                        lista.appendChild(fila);
                    });

                    if (encontradas.length > TOPE) {
                        const resto = document.createElement('div');
                        resto.style.cssText = 'padding:8px 12px; color:#94a3b8; font-size:0.78rem;';
                        resto.innerText = `y ${encontradas.length - TOPE} más; sigue escribiendo para acotar.`;
                        lista.appendChild(resto);
                    }

                    lista.style.display = 'block';
                };

                // La lista no se cierra al perder el foco: está en el flujo y
                // no tapa nada, y cerrarla en el blur se comería el toque
                // sobre la propia sugerencia.
                campo.onfocus = () => {
                    // Se selecciona lo que hay para que la primera tecla lo
                    // sustituya en vez de pegarse detrás y no encontrar nada.
                    campo.select();
                    pintarSugerencias(true);
                };

                campo.oninput = () => {
                    pintarSugerencias(false);
                    refrescarNota();
                };

                lista.style.display = 'none';
                refrescarNota();
            }

            async function guardarEquipo(filas) {
                const nombre = document.getElementById('inp-detalle-nombre').value.trim();
                // El ID se guarda con la grafía que ya tenga en el catálogo,
                // para no dejar dos variantes del mismo código.
                const escrito = idInternoElegido();
                const fichaEscrita = catalogoIdsInternos().get(claveDeId(escrito));
                const idInterno = fichaEscrita ? fichaEscrita.id : escrito;

                if (!nombre) {
                    alert("El nombre del equipo no puede quedar vacío.");
                    return;
                }

                // El nombre va pegado al ID: si el ID lo comparten altas de
                // otras líneas, todas acaban con el mismo nombre. Se avisa
                // antes, porque el cambio sale de la pantalla que se ve.
                const idsPropios = filas.map(f => f.id);
                const hermanos = hermanosDe(idInterno, idsPropios);
                const alcanzaAOtros = hermanos.some(e => (e.nombre || '') !== nombre);

                if (alcanzaAOtros) {
                    const aviso = `El ID «${idInterno}» lo usan ${hermanos.length + filas.length} altas de equipo.\n\n` +
                        `Todas quedarán con el nombre «${nombre}».`;
                    if (!confirm(aviso)) return;
                }

                estadoEdicionEquipo("Guardando…");

                try {
                    // Las dos consultas filtran por id y no por id_interno:
                    // así el ID puede cambiar de mayúsculas sin que el filtro
                    // deje fuera justo las filas que hay que corregir.
                    const { error } = await sb.from('equipos').update({
                        nombre: nombre,
                        id_interno: idInterno === "" ? null : idInterno
                    }).in('id', idsPropios);

                    if (error) throw error;

                    // A las altas de otras líneas sólo se les toca el nombre:
                    // su ID ya era el mismo, que es por lo que salieron aquí.
                    if (alcanzaAOtros) {
                        const { error: errorHermanos } = await sb.from('equipos')
                            .update({ nombre: nombre })
                            .in('id', hermanos.map(e => e.id));

                        if (errorHermanos) throw errorHermanos;
                    }

                    // Se actualiza la copia local para repintar sin recargar.
                    filas.forEach(f => {
                        f.nombre = nombre;
                        f.id_interno = idInterno === "" ? null : idInterno;
                    });
                    if (alcanzaAOtros) hermanos.forEach(e => { e.nombre = nombre; });

                    // Se cierra sólo la hoja de edición: el detalle se queda
                    // debajo con el nombre ya cambiado, que es de donde salió
                    // quien vino a editar.
                    window.cerrarEdicionEquipo();
                    dibujar();
                    refrescarDetalle();
                } catch (error) {
                    console.error("Error actualizando equipo:", error);
                    alert("Hubo un error de conexión al intentar guardar.");
                } finally {
                    estadoEdicionEquipo('');
                }
            }

            function colorEstado(estado) {
                // La etiqueta sigue a la banda del cuadro: verde sólo la que ya
                // confirmó el solicitante, ámbar la entregada que sigue esperando
                // ese acuse.
                if (estado === 'Recibida') return { fondo: '#dcfce7', texto: '#15803d' };
                if (estado === 'Entregada') return { fondo: '#fef3c7', texto: '#92400e' };
                if (estado === 'Cancelada') return { fondo: '#f1f5f9', texto: '#64748b' };
                return { fondo: '#ffedd5', texto: '#c2410c' };
            }

            function escapar(texto) {
                const div = document.createElement('div');
                div.innerText = texto === null || texto === undefined ? '' : String(texto);
                return div.innerHTML;
            }

            // El treemap se calcula contra el tamaño del lienzo, así que hay
            // que rehacerlo cuando el teléfono gira o cambia la ventana.
            let temporizadorMedida = null;
            const rehacer = () => {
                clearTimeout(temporizadorMedida);
                temporizadorMedida = setTimeout(dibujar, 120);
            };
            window.addEventListener('resize', rehacer);
            window.addEventListener('orientationchange', rehacer);
        });
    </script>
</body>
