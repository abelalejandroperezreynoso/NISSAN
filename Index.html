<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aplicación HTML simple</title>
    <style>
      :root{--bg:#f7f9fc;--card:#ffffff;--accent:#2b8be6}
      body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;padding:2rem;background:var(--bg);color:#0b2136}
      .app{max-width:640px;margin:0 auto}
      .card{background:var(--card);padding:1.5rem;border-radius:12px;box-shadow:0 6px 18px rgba(11,33,54,0.06)}
      h1{margin:0 0 0.25rem;font-size:1.4rem}
      p.lead{margin:0 0 1rem;color:#375a7f}
      .controls{display:flex;gap:0.5rem;align-items:center;margin-top:1rem}
      button{background:var(--accent);color:#fff;border:none;padding:0.6rem 0.9rem;border-radius:8px;cursor:pointer}
      button:active{transform:translateY(1px)}
      .counter{font-weight:700;font-size:2rem;margin:0 0.5rem}
      footer{margin-top:1.25rem;font-size:0.85rem;color:#556b7a}
      input[type="text"]{flex:1;padding:0.5rem;border:1px solid #e6eef8;border-radius:8px}
    </style>
  </head>
  <body>
    <main class="app">
      <div class="card" role="application" aria-label="Aplicación de ejemplo">
        <h1>Aplicación HTML simple</h1>
        <p class="lead">Un ejemplo mínimo con contador, entrada de texto y estilo sencillo.</p>

        <label for="name">Tu nombre (opcional):</label>
        <div style="margin-top:0.5rem;">
          <input id="name" type="text" placeholder="Escribe tu nombre" />
        </div>

        <div class="controls">
          <button id="decrease">-</button>
          <div class="counter" id="count">0</div>
          <button id="increase">+</button>
        </div>

        <p id="greeting" style="margin-top:1rem">Hola — introduce tu nombre arriba y pulsa + o - para cambiar el contador.</p>

        <footer>
          Consejo: este archivo es estático, puedes abrirlo localmente o servirlo desde GitHub Pages.
        </footer>
      </div>
    </main>

    <script>
      (function(){
        const countEl = document.getElementById('count');
        const inc = document.getElementById('increase');
        const dec = document.getElementById('decrease');
        const nameInput = document.getElementById('name');
        const greeting = document.getElementById('greeting');

        let count = 0;

        function render(){
          countEl.textContent = count;
          const name = nameInput.value.trim();
          greeting.textContent = name ? `Hola, ${name}! El contador vale ${count}.` : `Hola — introduce tu nombre arriba y pulsa + o - para cambiar el contador.`;
        }

        inc.addEventListener('click',()=>{ count++; render(); });
        dec.addEventListener('click',()=>{ count--; render(); });
        nameInput.addEventListener('input', render);

        // accesibilidad: permitir teclas + y -
        document.addEventListener('keydown',(e)=>{
          if(e.key === '+' || e.key === '='){ count++; render(); }
          if(e.key === '-' || e.key === '_'){ count--; render(); }
        });

        render();
      })();
    </script>
  </body>
</html>
